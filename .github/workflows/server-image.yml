name: Server image

# Builds the spotDL server image for amd64 and arm64 and publishes it to the
# GitHub Container Registry as ghcr.io/<owner>/<repo>.
#
# The image is rebuilt every week with the newest yt-dlp release, because older
# yt-dlp releases stop working as YouTube changes.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "spotdl/**"
      - "Dockerfile.server"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/server-image.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest yt-dlp release
        id: ytdlp
        run: |
          version=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "Using yt-dlp $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=spotDL server
            org.opencontainers.image.description=Self-hosted web UI for spotDL

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            YT_DLP_VERSION=${{ steps.ytdlp.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
